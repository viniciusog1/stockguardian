name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check & tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockguardian
          POSTGRES_PASSWORD: stockguardian
          POSTGRES_DB: stockguardian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockguardian -d stockguardian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://stockguardian:stockguardian@localhost:5432/stockguardian_test
      SECRET_KEY: ci-secret-key-not-for-production
      UV_NO_SYNC: "1"  # uv run usa o ambiente já instalado, com os extras de dev

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff (lint + format check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy (type check)
        run: uv run mypy app

      - name: Pytest (unit + integration)
        run: uv run pytest --cov=app --cov-report=term-missing
